[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Repo-root paths: frontend-only pushes to runnr.fyi must not rebuild the API
# (that was wiping sqlite whenever GitHub Pages shipped).
watchPatterns = ["/api/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# SQLite + volume: keep a single replica. Do not scale replicas with this DB.
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 30
requiredMountPath = "/data"
# Volumes cannot overlap two containers. Drain so WAL can checkpoint.
overlapSeconds = 0
drainingSeconds = 20

# Persistent sqlite: Railway → this service → Volumes → Add, mount path /data.
# That sets RAILWAY_VOLUME_MOUNT_PATH=/data. DATABASE_PATH defaults to /data/runnr.db.
# Email confirm:
#   RESEND_API_KEY=re_...
#   RESEND_FROM_EMAIL=Runnr <noreply@runnr.fyi>
# Verify the domain in Resend, then health.email_configured should be true.
# Trading 212: users paste a read-only API key+secret on Sync (encrypted per account).
# Do not use T212_API_KEY / T212_API_SECRET as a product path. HTTP Basic, GET only,
# live.trading212.com — Invest / Stocks ISA (not SIPP). Never place orders.
