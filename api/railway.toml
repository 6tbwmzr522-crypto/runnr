[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Repo-root paths: frontend-only pushes to runnr.fyi must not rebuild the API
# (that was wiping sqlite whenever GitHub Pages shipped).
watchPatterns = ["/api/**"]

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
healthcheckPath = "/health"
healthcheckTimeout = 30
requiredMountPath = "/data"
# Volumes cannot overlap two containers. Drain so WAL can checkpoint.
overlapSeconds = 0
drainingSeconds = 20

# Persistent sqlite: Railway → this service → Volumes → Add, mount path /data.
# That sets RAILWAY_VOLUME_MOUNT_PATH=/data. DATABASE_PATH defaults to /data/runnr.db.
# Email confirm:
#   RESEND_API_KEY=re_...
#   RESEND_FROM_EMAIL=Runnr <noreply@runnr.fyi>
# Verify the domain in Resend, then health.email_configured should be true.
